<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel de Custos TI 3RN</title>
<style>
/* ============================================================
   Painel de Custos TI — Grupo 3RN (arquivo único, sem build)
   ============================================================ */
:root{
  --bg:#f1f5f9; --panel:#ffffff; --panel-2:#f8fafc; --border:#e5e7eb;
  --txt:#1e293b; --muted:#64748b; --muted-2:#94a3b8;
  --blue:#1d4ed8; --blue-ink:#1e3a8a; --amber:#d97706; --violet:#7c3aed; --emerald:#059669;
  --red:#dc2626; --red-bg:#fef2f2; --red-bd:#fecaca;
  --amber-bg:#fffbeb; --amber-bd:#fde68a; --amber-ink:#92400e;
  --emerald-bg:#ecfdf5; --emerald-bd:#a7f3d0; --emerald-ink:#065f46;
  --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 8px 24px rgba(2,6,23,.12);
}
:root[data-theme="dark"]{
  --bg:#020617; --panel:#0f172a; --panel-2:#1e293b; --border:#334155;
  --txt:#e2e8f0; --muted:#94a3b8; --muted-2:#64748b;
  --blue:#60a5fa; --amber:#fbbf24; --violet:#a78bfa; --emerald:#34d399;
  --red:#f87171; --red-bg:rgba(239,68,68,.10); --red-bd:rgba(239,68,68,.25);
  --amber-bg:rgba(245,158,11,.10); --amber-bd:rgba(245,158,11,.25); --amber-ink:#fcd34d;
  --emerald-bg:rgba(16,185,129,.10); --emerald-bd:rgba(16,185,129,.25); --emerald-ink:#6ee7b7;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#020617; --panel:#0f172a; --panel-2:#1e293b; --border:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --muted-2:#64748b;
    --blue:#60a5fa; --amber:#fbbf24; --violet:#a78bfa; --emerald:#34d399;
    --red:#f87171; --red-bg:rgba(239,68,68,.10); --red-bd:rgba(239,68,68,.25);
    --amber-bg:rgba(245,158,11,.10); --amber-bd:rgba(245,158,11,.25); --amber-ink:#fcd34d;
    --emerald-bg:rgba(16,185,129,.10); --emerald-bd:rgba(16,185,129,.25); --emerald-ink:#6ee7b7;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
.kpi .kv,.legrow .vv,.legrow .pc,.res .rprice,.res .rbrl,.plat .pval,.stat .sv,.stat .ss,.lic .lp,.dc-v,.gcard .gv,.gcard .gvb,#usd{font-variant-numeric:tabular-nums}
body{background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased;}
.wrap{max-width:1280px; margin:0 auto; padding:16px 20px 28px}
.spacer{margin-left:auto}
.uplabel{font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.card{background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
svg{display:block}
.ic{width:20px;height:20px;flex-shrink:0}
.brand{height:20px;width:auto;flex-shrink:0}

/* Topbar */
.top{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.top .badge{display:grid; place-items:center; width:40px; height:40px; border-radius:12px;
  background:linear-gradient(135deg,var(--blue-ink),#1d4ed8); color:#fff; box-shadow:var(--shadow)}
.top .badge svg{width:22px;height:22px}
.top h1{margin:0; font-size:18px; font-weight:800}
.top p{margin:2px 0 0; font-size:12px; color:var(--muted)}
.fxbox{display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--border); border-radius:12px; background:var(--panel); box-shadow:var(--shadow)}
.fxbox .uplabel{color:var(--muted)}
.fxbox input{width:74px; border:1px solid var(--border); background:var(--panel-2); color:var(--txt); border-radius:8px; padding:5px 8px; font-size:13px; outline:none; font-weight:700}
.fxbox input:focus{border-color:#3b82f6}
.iconbtn{border:1px solid var(--border); background:var(--panel); color:var(--txt); width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--panel-2)} .iconbtn svg{width:15px;height:15px}
.btn-ghost{border:1px solid var(--border); background:var(--panel); color:var(--txt);
  border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; gap:6px; align-items:center}
.btn-ghost:hover{background:var(--panel-2)} .btn-ghost svg{width:16px;height:16px}
.pill{border-radius:999px; padding:5px 11px; font-size:12px; font-weight:800; background:rgba(59,130,246,.12); color:#2563eb}
:root[data-theme="dark"] .pill{background:rgba(59,130,246,.18); color:#93c5fd}
.pill-live{background:rgba(16,185,129,.14); color:#059669}
:root[data-theme="dark"] .pill-live{color:#6ee7b7}
.pill-mut{background:rgba(100,116,139,.15); color:var(--muted)}

/* Controls */
.controls{display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; padding:14px 16px; margin-bottom:14px}
.controls label{display:flex; align-items:center; gap:8px}
.controls input,.controls select{border:1px solid var(--border); background:var(--panel); color:var(--txt);
  border-radius:9px; padding:7px 10px; font-size:13px; outline:none}
.controls input:focus{border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.controls input[type=number]{width:66px}
.controls input[type=date]{width:154px}
.divider{width:1px; align-self:stretch; background:var(--border)}

/* KPIs */
.kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:14px}
.kpi{border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); border:1px solid var(--border); background:var(--panel); min-width:0}
.kpi .kh{display:flex; align-items:center; justify-content:space-between; gap:8px}
.kpi .kt{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
.kpi .khi{display:flex;align-items:center;color:var(--muted-2)}
.kpi .kv{margin:8px 0 2px; font-size:18px; font-weight:800; letter-spacing:-.01em; overflow-wrap:anywhere}
.kpi .ks{font-size:11px; color:var(--muted)}
.kpi.dark{background:linear-gradient(135deg,#0f172a,#1e293b); border-color:#0f172a; color:#fff}
.kpi.dark .kt{color:#94a3b8} .kpi.dark .ks{color:#cbd5e1} .kpi.dark .kv{color:#fff} .kpi.dark .khi{color:#64748b}
.kpi.warn{background:var(--amber-bg); border-color:var(--amber-bd)}
.kpi.warn .kv{color:var(--amber)} .kpi.warn .khi{color:var(--amber)}

/* Donut + alerts */
.mid{display:grid; grid-template-columns:340px 1fr; gap:14px; margin-bottom:14px}
.donut-card{padding:16px}
.donut-card h3{margin:0 0 12px}
.donut-flex{display:flex; align-items:center; gap:16px}
.donut-wrap{position:relative; width:132px; height:132px; flex-shrink:0}
.donut-wrap svg{transform:rotate(-90deg)}
#donut circle.slice{cursor:pointer; transition:opacity .12s}
#donut.dim circle.slice:not(.active){opacity:.3}
.donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; padding:0 16px}
.donut-center .dc-t{font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--muted)}
.donut-center .dc-v{font-size:13px; font-weight:800; line-height:1.15; margin-top:1px}
.donut-center .dc-s{font-size:9px; color:var(--muted-2); margin-top:1px}
.legend{display:flex; flex-direction:column; gap:7px; min-width:0; flex:1}
.legrow{display:flex; align-items:center; gap:9px; font-size:12px; cursor:pointer; border-radius:8px; padding:4px 6px; margin:-2px -4px}
.legrow:hover,.legrow.active{background:var(--panel-2)}
.legrow .sw{width:11px; height:11px; border-radius:3px; flex-shrink:0}
.legrow .meta{min-width:0; flex:1}
.legrow .lb{color:var(--muted); font-weight:600; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.legrow .row2{display:flex; align-items:baseline; justify-content:space-between; gap:10px; line-height:1.25; margin-top:1px}
.legrow .vv{font-weight:800; white-space:nowrap; color:var(--txt)}
.legrow .pc{color:var(--muted-2); font-size:11px; white-space:nowrap}
.alerts{display:flex; flex-direction:column; gap:8px}
.alert{display:flex; gap:9px; align-items:flex-start; border:1px solid; border-radius:12px; padding:11px 14px; font-size:13px; font-weight:500}
.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0}
.alert.warn{background:var(--red-bg); border-color:var(--red-bd); color:var(--red)} .alert.warn .dot{background:var(--red)}
.alert.info{background:var(--amber-bg); border-color:var(--amber-bd); color:var(--amber-ink)} .alert.info .dot{background:var(--amber)}
.alert.ok{background:var(--emerald-bg); border-color:var(--emerald-bd); color:var(--emerald-ink)} .alert.ok .dot{background:var(--emerald)}

/* Platform buttons */
.plats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.plat{display:flex; flex-direction:column; gap:10px; text-align:left; cursor:pointer;
  background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow);
  transition:transform .12s, box-shadow .12s; color:var(--txt)}
.plat:hover{transform:translateY(-2px); box-shadow:var(--shadow-md)}
.plat .ph{display:flex; align-items:center; justify-content:space-between; min-height:26px}
.plat .chev{color:var(--muted-2)}
.plat .plabel{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
.plat .pval{margin:4px 0 1px; font-size:22px; font-weight:800; letter-spacing:-.02em}
.plat .psub{font-size:11px; color:var(--muted)}
.plat .pfoot{font-size:11px; font-weight:600; color:var(--muted-2)}
.plat .pfoot.ok{color:var(--emerald)}
.plat[data-c=do]  .pval{color:var(--blue)}
.plat[data-c=aws] .pval{color:var(--amber)}
.plat[data-c=lic] .pval{color:var(--violet)}
.plat[data-c=ds]  .pval{color:var(--emerald)}
.hint{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 8px}

/* Overlays */
.ov{position:fixed; inset:0; z-index:50; display:none; align-items:flex-start; justify-content:center;
  padding:28px 16px; background:rgba(2,6,23,.55); backdrop-filter:blur(2px); overflow:auto}
.ov.on{display:flex}
.sheet{width:100%; max-width:1080px; background:var(--panel); border:1px solid var(--border); border-radius:18px;
  box-shadow:var(--shadow-md); overflow:hidden; animation:pop .16s ease-out}
.sheet.sm{max-width:640px}
@keyframes pop{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
.dhead{display:flex; align-items:center; justify-content:space-between; padding:16px 22px;
  background:linear-gradient(90deg,#1e3a8a,#1d4ed8,#2563eb); color:#fff}
.dhead .dt{font-size:14px; font-weight:800}
.dhead .db{font-size:12px; color:#bfdbfe; margin-top:2px}
.dhead .dbrand{display:flex;align-items:center;gap:10px}
.dhead .chip-logo{background:#fff;border-radius:9px;padding:5px 7px;display:flex;align-items:center}
.dhead .chip-logo .brand{height:18px}
.xbtn{border:0; background:rgba(255,255,255,.14); color:#fff; width:30px; height:30px; border-radius:9px; cursor:pointer; display:grid; place-items:center}
.xbtn:hover{background:rgba(255,255,255,.26)} .xbtn svg{width:16px;height:16px}
.banner{padding:10px 22px; font-size:12px; font-weight:600; display:flex; gap:8px; align-items:flex-start}
.banner svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.banner.warn{background:var(--amber-bg); border-bottom:1px solid var(--amber-bd); color:var(--amber-ink)}
.backbar{display:flex;align-items:center;gap:10px;padding:12px 22px 0}
.backbtn{border:1px solid var(--border);background:var(--panel);color:var(--txt);border-radius:9px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.backbtn:hover{background:var(--panel-2)} .backbtn svg{width:14px;height:14px}
.backbar .bt{font-size:13px;font-weight:800}
.grid-res{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; padding:16px 22px}
.grid-grp{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; padding:18px 22px}

/* Group card */
.gcard{cursor:pointer; display:flex; flex-direction:column; gap:8px; background:var(--panel); border:1px solid var(--border);
  border-left:4px solid var(--gc,var(--blue)); border-radius:14px; padding:14px 15px; box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s}
.gcard:hover{transform:translateY(-2px); box-shadow:var(--shadow-md)}
.gcard .gh{display:flex; align-items:center; justify-content:space-between; gap:8px}
.gcard .gname{font-size:14px; font-weight:800}
.gcard .gdesc{font-size:11.5px; color:var(--muted); line-height:1.4; min-height:32px}
.gcard .gfoot{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:2px; border-top:1px solid var(--border); padding-top:8px}
.gcard .gv{font-size:19px; font-weight:800}
.gcard .gvb{font-size:11px; color:var(--muted)}
.gcard .gdelta{font-size:11px; font-weight:700}
.gcard .gopen{font-size:11px;font-weight:700;color:#2563eb;display:flex;align-items:center;gap:3px}
.gcard[data-c=aws]{--gc:var(--amber)} .gcard[data-c=aws] .gv{color:var(--amber)}
.gcard[data-c=do]{--gc:var(--blue)} .gcard[data-c=do] .gv{color:var(--blue)}

/* Resource card */
.res{position:relative; display:flex; flex-direction:column; gap:6px; background:var(--panel);
  border:1px solid var(--border); border-top:4px solid var(--tc,var(--blue)); border-radius:14px; padding:13px 14px; box-shadow:var(--shadow);
  transition:transform .12s, box-shadow .12s}
.res.click{cursor:pointer}
.res.click:hover{transform:translateY(-2px); box-shadow:var(--shadow-md)}
.res .rh{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.res .rn{font-size:13px; font-weight:700; line-height:1.25}
.res .rprice{font-size:19px; font-weight:800}
.res .rprice small{font-size:11px; font-weight:400; color:var(--muted-2)}
.res .rbrl{font-size:11px; color:var(--muted)}
.res .rdet{font-size:11px; color:var(--muted); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.res .rdelta{font-size:11px; font-weight:700}
.res .rproj{font-size:10px; color:var(--muted-2)}
.res .rmore{font-size:10px; font-weight:600; color:#2563eb; opacity:0; transition:opacity .12s}
.res.click:hover .rmore{opacity:1}
.res[data-c=do] .rprice{color:var(--blue)} .res[data-c=aws] .rprice{color:var(--amber)}
.chip{flex-shrink:0; border-radius:999px; padding:2px 8px; font-size:10px; font-weight:800; background:rgba(100,116,139,.16); color:#475569}
.chip.RDS,.chip.NAT{background:rgba(217,119,6,.15); color:#b45309}
.chip.ECS,.chip.Droplet{background:rgba(29,78,216,.13); color:#1d4ed8}
.chip.EC2{background:rgba(5,150,105,.14); color:#047857}
.chip.VPC{background:rgba(124,58,237,.14); color:#6d28d9}
.chip.ELB{background:rgba(217,70,239,.14); color:#a21caf}
.chip.CW{background:rgba(234,88,12,.14); color:#c2410c}
.chip.S3{background:rgba(13,148,136,.14); color:#0f766e}
.chip.WAF{background:rgba(220,38,38,.14); color:#b91c1c}
.chip.ECR{background:rgba(2,132,199,.14); color:#0369a1}
:root[data-theme="dark"] .chip{filter:brightness(1.35)}

/* Modal detail */
.stat4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:18px 22px 6px}
.stat{background:var(--panel-2); border-radius:12px; padding:14px}
.stat .st{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
.stat .sv{margin:4px 0 1px; font-size:18px; font-weight:800}
.stat .ss{font-size:11px; color:var(--muted)}
.tags{display:flex; flex-wrap:wrap; gap:8px; padding:6px 22px 4px}
.tag{border:1px solid var(--border); background:var(--panel-2); border-radius:9px; padding:7px 11px; font-size:12px; color:var(--muted)}
.tag strong{color:var(--txt)}
.mfoot{display:flex; justify-content:flex-end; padding:14px 22px; border-top:1px solid var(--border)}
.up{color:var(--red)} .down{color:var(--emerald)}

/* license + deepseek */
.lic{display:flex; flex-direction:column; gap:6px; background:var(--panel); border:1px solid var(--border);
  border-top:4px solid var(--violet); border-radius:14px; padding:14px; box-shadow:var(--shadow)}
.lic .lh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lic .ln{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.lic .lp{font-size:20px; font-weight:800; color:var(--violet)}
.lic .lp small{font-size:11px;font-weight:400;color:var(--muted-2)}
.ds-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px 22px}
.ds-field{display:flex; flex-direction:column; gap:5px}
.ds-field input{border:1px solid var(--border); background:var(--panel); color:var(--txt); border-radius:9px; padding:8px 11px; font-size:13px; outline:none}
.ds-field input:focus{border-color:#3b82f6}
.ds-cards{display:flex; gap:12px; flex-wrap:wrap; padding:0 22px 18px}
.ds-card{border-radius:12px; padding:10px 18px; border:1px solid var(--border); background:var(--panel-2)}
.ds-card .st{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ds-card.total{border-color:var(--emerald-bd); background:var(--emerald-bg)}
.ds-card.total .st{color:var(--emerald-ink)} .ds-card.total .sv{color:var(--emerald)}
.ds-card .sv{font-size:20px;font-weight:800}
.dsmsg{padding:0 22px 14px; font-size:11.5px; color:var(--muted)}
.foot{margin-top:22px; text-align:center; font-size:11px; color:var(--muted-2)}

@media (max-width:1024px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .mid{grid-template-columns:1fr}
  .plats{grid-template-columns:repeat(2,1fr)}
  .stat4{grid-template-columns:repeat(2,1fr)}
  .ds-grid{grid-template-columns:1fr}
}
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2,1fr)} .plats{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="badge" id="topBadge"></div>
    <div><h1>Painel de Custos TI</h1><p>Visão consolidada · Digital Ocean · AWS · Licenças · DeepSeek</p></div>
    <div class="spacer"></div>
    <div class="fxbox">
      <span class="uplabel">USD/BRL</span>
      <input id="usd" type="number" step="0.01" min="1" max="20" />
      <button class="iconbtn" id="fxBtn" title="Cotação ao vivo"><span id="fxIc"></span></button>
      <span class="pill pill-live" id="fxTag">27/08</span>
    </div>
    <button class="btn-ghost" id="themeBtn" title="Alternar tema"><span id="themeIc"></span> Tema</button>
  </div>

  <div class="card controls">
    <label><span class="uplabel">De</span><input id="dStart" type="date" /></label>
    <label><span class="uplabel">Até</span><input id="dEnd" type="date" /></label>
    <span class="pill" id="daysTag">—</span>
    <span class="pill pill-mut" id="modeTag"></span>
    <div class="divider"></div>
    <label><span class="uplabel">Claude Pro</span><input id="claude" type="number" min="0" max="500" /></label>
    <label><span class="uplabel">Figma</span><input id="figma" type="number" min="0" max="200" /></label>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="mid">
    <div class="card donut-card">
      <h3 class="uplabel">Distribuição de gastos · clique para abrir</h3>
      <div class="donut-flex">
        <div class="donut-wrap"><svg id="donut" width="132" height="132" viewBox="0 0 132 132"></svg><div class="donut-center" id="donutCenter"></div></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div>
      <p class="uplabel" style="margin:0 0 8px">Alertas automáticos</p>
      <div class="alerts" id="alerts"></div>
    </div>
  </div>

  <p class="hint">Selecione uma plataforma para ver os recursos (clique)</p>
  <div class="plats" id="plats"></div>

    svg.appendChild(c);off+=dash;});
  const leg=document.getElementById('legend');leg.innerHTML='';

/* ============ DeepSeek automático (client-side) ============ */
async function deepseekAuto(force){
  if(state.apiMode&&!force) return;             // com backend já vem pronto
  const key=(lsGet('ds-key')||'').trim(), tot=parseFloat(lsGet('ds-total'));
  if(!key||isNaN(tot)) return;
  try{
    const r=await fetchT('https://api.deepseek.com/user/balance',8000,{headers:{Authorization:'Bearer '+key,Accept:'application/json'}});
    if(!r.ok) return;
    const j=await r.json();const info=(j.balance_infos||[]).find(b=>b.currency==='USD')||(j.balance_infos||[])[0];
    if(info){state.dsBalance=+info.total_balance;state.dsUsd=Math.max(0,+(tot-(+info.topped_up_balance)).toFixed(2));renderAll();}
  }catch(_){/* CSP do preview do artifact bloqueia; funciona no arquivo local/backend */}
}

async function loadData(){
  readDates();
  if(CONFIG.apiBase){
    const qs=`?start=${state.start}&end=${state.end}`;
    try{
      const r=await fetchT(CONFIG.apiBase+'/api/all'+qs,9000);const j=await r.json();
      if(j.digitalocean&&!j.digitalocean.error){DATA.doDroplets=j.digitalocean.droplets||DATA.doDroplets;DATA.doDatabases=j.digitalocean.databases||DATA.doDatabases;DATA.doSnapshots=j.digitalocean.snapshots||DATA.doSnapshots;DATA.idleIps=(j.digitalocean.reservedIps||[]).filter(i=>!i.atribuido).map(i=>i.ip);}
      if(j.aws&&!j.aws.error&&j.aws.resources&&j.aws.resources.length)DATA.aws=j.aws.resources;
      if(j.licencas){state.claude=j.licencas.claudeUsers??state.claude;state.claudeMaxN=j.licencas.claudeMaxLic??state.claudeMaxN;state.claudeMaxUnit=j.licencas.claudeMaxUnitBrl??state.claudeMaxUnit;state.figma=j.licencas.figmaLicencas??state.figma;}
      if(j.deepseek&&!j.deepseek.error){state.dsBalance=j.deepseek.balanceUsd;if(j.deepseek.spentUsd!=null)state.dsUsd=j.deepseek.spentUsd;}
      if(j.fx&&j.fx.rate)state.usd=+(+j.fx.rate).toFixed(4);
      state.apiMode=true;
    }catch(_){state.apiMode=false;DATA=JSON.parse(JSON.stringify(SNAP));}
  }else{state.apiMode=false;DATA=JSON.parse(JSON.stringify(SNAP));}
  syncInputs();renderAll();
  deepseekAuto();
}
